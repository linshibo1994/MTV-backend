version: "3.9"

x-backend-common: &backend-common
  image: python:3.12-slim
  working_dir: /app
  volumes:
    - .:/app
  environment:
    APP_ENV: local
    DATABASE_URL: postgresql+asyncpg://flow:flow@postgres:5432/flowapp
    DATABASE_SYNC_URL: postgresql+psycopg2://flow:flow@postgres:5432/flowapp
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    SESSION_SECRET: local-dev-session-secret-at-least-32-chars
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowapp-pg
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
      POSTGRES_DB: flowapp
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d flowapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flowapp-redis
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery-worker:
    <<: *backend-common
    container_name: flowapp-celery-worker
    command: >
      sh -lc "pip install -e . &&
      celery -A app.workers.celery_app worker -l info"

  celery-beat:
    <<: *backend-common
    container_name: flowapp-celery-beat
    command: >
      sh -lc "pip install -e . &&
      celery -A app.workers.celery_app beat -l info"

volumes:
  postgres_data:
  redis_data:
