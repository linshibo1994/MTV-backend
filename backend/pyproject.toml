[project]
name = "flowapp-backend"
version = "0.1.0"
description = "智绘 Flow App 后端复刻 — AI 影视制作流水线 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9,<3.0",
    "alembic>=1.13.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.4",
    "celery>=5.4.0",
    "itsdangerous>=2.2.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "python-multipart>=0.0.9",
    "openai>=1.35.0",
    "google-genai>=2.12.1",
    "volcengine-python-sdk>=5.0.0",
    "pillow>=10.3.0",
    "pydub>=0.25.1",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.6,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
aliyun-oss = ["alibabacloud-oss-v2>=1.3.2,<2.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:'crypt' is deprecated and slated for removal in Python 3\\.13:DeprecationWarning:passlib\\.utils",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
